<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>F42</title>
    <link rel="stylesheet" href="style.css">
</head>
<body class="Body">

    <header class="navHeader">
        <ul class="listMain">
            <li class="itemMenu"><a href="#hero">Главная</a></li>
            <li class="itemMenu"><a href="#about">О нас</a></li>
            <li class="itemMenu"><a href="#table">Таблица</a></li>
            <li class="itemMenu"><a href="#subscribe">Подписка</a></li>
            <li class="itemMenu" id="btnAllForSite">
                Меню
                <div id="menuAllForSite">
                    <a href="#hero">Главная</a>
                    <a href="#about">О нас</a>
                    <a href="#table">Таблица</a>
                    <a href="#subscribe">Подписка</a>
                </div>
            </li>
        </ul>
    </header>

    <section id="hero">
        <div class="heroBox">
            <h1>Добро пожаловать</h1>
            <p>Это наш сайт с фоном, меню и формой подписки.</p>
        </div>
    </section>

    <section id="about" class="contentBox">
        <h2>О нас</h2>
        <p>Здесь текст о сайте. Блок с прозрачным фоном и размытием.</p>
    </section>

    <section id="table" class="contentBox">
        <h2>Таблица</h2>
        <div class="tablepaddle">
            <table class="table">
                <thead>
                    <tr>
                        <th>#</th>
                        <th>Название</th>
                        <th>Значение</th>
                    </tr>
                </thead>
                <tbody>
                    <tr>
                        <td>1</td>
                        <td>Пример</td>
                        <td>100</td>
                    </tr>
                    <tr>
                        <td>2</td>
                        <td>Пример</td>
                        <td>200</td>
                    </tr>
                    <tr>
                        <td>3</td>
                        <td>Пример</td>
                        <td>300</td>
                    </tr>
                </tbody>
            </table>
        </div>
    </section>

    <section id="subscribe" class="contentBox">
        <h2>Подписка</h2>
        <form method="post" class="newsform">
            <div class="newsformpadding">
                <label for="email">Email:</label>
                <input type="email" name="email" id="email" required>

                <label for="tel">Phone number:</label>
                <input type="tel" name="tel" id="tel">

                <button type="submit" name="submitbutton" id="submitbutton">Subscribe</button>
            </div>
        </form>
    </section>

</body>
</html>
